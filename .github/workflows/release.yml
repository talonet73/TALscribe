name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Strumenti di build
        working-directory: tools
        run: npm install
      - name: Componenti Windows (Electron, whisper.cpp, FFmpeg, yt-dlp, Deno, VC++)
        run: bash tools/fetch-deps.sh
      - name: Build zip portatile
        working-directory: tools
        run: node build-win.js
      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TALscribe-*-win-x64.zip
          generate_release_notes: true
      - name: Artefatto (avvio manuale)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: TALscribe-win-x64
          path: dist/TALscribe-*-win-x64.zip
